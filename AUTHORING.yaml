  title: Controller Manager
  curriculum_item: Controller Manager
  modules:
  - id: module-01
    title: Controller Manager Authority
    objectives:
    - Explain controller reconciliation and API permissions.
    - Identify consequences of a compromised controller identity.
    - Relate controller availability to workload recovery.
    - Distinguish Kubernetes controller behavior from application data repair.
    outline:
    - Securing Reconciliation Components
    playground: false
    module_lab: false
    diagrams: []
  capstone: false
  section_quiz: false
- id: section-030
  title: Scheduler
  curriculum_item: Scheduler
  modules:
  - id: module-01
    title: Scheduler Integrity And Availability
    objectives:
    - Explain what the scheduler decides and what it cannot execute.
    - Relate node labels and placement rules to security assumptions.
    - Identify the impact of scheduler identity or configuration compromise.
    - Distinguish placement controls from complete tenant isolation.
    outline:
    - Protecting Placement Decisions
    playground: false
    module_lab: false
    diagrams: []
  capstone: false
  section_quiz: false
