  title: Container Networking
  curriculum_item: Container Networking
  modules:
  - id: module-01
    title: Container Network Trust
    objectives:
    - Identify the network implementation's authority and dependencies.
    - Distinguish Service forwarding from connection policy enforcement.
    - Relate node access, plaintext traffic and trusted peers.
    - Explain how network segmentation limits compromise paths.
    outline:
    - Pod Networks And Policy Boundaries
    - Allowed Connections And Enforcement
    playground: false
    module_lab: false
    diagrams: []
  capstone: false
  section_quiz: false
