  title: KubeProxy
  curriculum_item: KubeProxy
  modules:
  - id: module-01
    title: KubeProxy And Service Forwarding
    objectives:
    - Explain kube-proxy's Service forwarding responsibility.
    - Distinguish forwarding from authentication and encryption.
    - Identify risks from compromised forwarding configuration.
    - Relate alternative implementations to the same security contract.
    outline:
    - Protecting The Service Traffic Path
    playground: false
    module_lab: false
    diagrams: []
  capstone: false
  section_quiz: false
- id: section-070
  title: Pod
  curriculum_item: Pod
  modules:
  - id: module-01
    title: Pod Execution And Credential Boundaries
    objectives:
    - Explain shared resources and trust within a multi-container Pod.
    - Identify unnecessary host access and API credential exposure.
    - Relate security context and admission to Pod execution.
    - Describe replacement without assuming restored trust.
    outline:
    - Pod-Level Privileges And Application Access
    playground: false
    module_lab: false
    diagrams: []
  capstone: false
  section_quiz: false
