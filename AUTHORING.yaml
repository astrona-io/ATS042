  title: Kubelet
  curriculum_item: Kubelet
  modules:
  - id: module-01
    title: Kubelet And Node Access
    objectives:
    - Explain the kubelet's authority over assigned Pods.
    - Distinguish API permissions from direct node-agent access.
    - Identify sensitive data available through node and workload operations.
    - Relate node credentials and endpoint protection to cluster trust.
    outline:
    - Protecting The Node Agent
    playground: false
    module_lab: false
    diagrams: []
  capstone: false
  section_quiz: true
- id: section-050
  title: Container Runtime
  curriculum_item: Container Runtime
  modules:
  - id: module-01
    title: Container Runtime Protection
    objectives:
    - Explain the runtime's execution authority and CRI boundary.
    - Identify risks from exposed runtime sockets and privileged containers.
    - Relate image selection to execution trust.
    - Compare runtime isolation with application authorization.
    outline:
    - Runtime Interfaces And Host Authority
    - Protecting Runtime Access And Execution Privileges
    playground: false
    module_lab: false
    diagrams: []
  capstone: false
  section_quiz: false
