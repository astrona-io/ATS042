apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intern
  namespace: starfleet
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: probe
  namespace: starfleet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet
  labels:
    app: probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      serviceAccountName: probe
      containers:
        - name: probe
          image: mccutchen/go-httpbin:2.25.0
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: starfleet
spec:
  selector:
    app: probe
  type: NodePort
  externalIPs: ["203.0.113.10"]
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traffic-editor
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["*"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: intern-traffic
subjects:
  - kind: ServiceAccount
    name: intern
    namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traffic-editor
