apiVersion: v1
kind: Namespace
metadata:
  name: lane
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cargo
  namespace: lane
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: beacon
  namespace: lane
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lane-ops
  namespace: lane
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargo
  namespace: lane
  labels:
    app: cargo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cargo
  template:
    metadata:
      labels:
        app: cargo
    spec:
      serviceAccountName: cargo
      containers:
        - name: cargo
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beacon
  namespace: lane
  labels:
    app: beacon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beacon
  template:
    metadata:
      labels:
        app: beacon
    spec:
      serviceAccountName: beacon
      containers:
        - name: beacon
          image: mccutchen/go-httpbin:2.25.0
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cargo
  namespace: lane
spec:
  selector:
    app: cargo
  type: NodePort
  externalIPs: ["203.0.113.20"]
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: beacon
  namespace: lane
spec:
  selector:
    app: beacon
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lane-editor
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["*"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lane-ops-editor
subjects:
  - kind: ServiceAccount
    name: lane-ops
    namespace: lane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lane-editor
