# Knowledge check for section 110. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats042-110
course_id: ATS042
exam_code: KCSA
status: draft
provenance: Original practice material written for this course; not official exam
  questions.
scope:
  type: section
  id: section-110
  title: Storage Access And Data Security
questions:
- id: ats042-110-q01
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain why permission on a claim object does not control the
    data.
  source_readings:
  - sections/section-110/module-01/course-01-volumes-claims-and-who-reaches-the-data.md
  prompt: A service account can get and list persistentvolumeclaims in a namespace
    and can also create pods there. What can it read?
  options:
  - id: a
    text: Only the claim objects.
    explanation: It can start a pod that mounts any claim of the namespace.
  - id: b
    text: The data in every claim of the namespace, by starting a pod that mounts
      the claim.
    explanation: Correct. The kubelet mounts the volume for the new pod.
  - id: c
    text: Nothing, because pods cannot mount claims they do not own.
    explanation: The API does not check ownership of the claim.
  - id: d
    text: Only claims in other namespaces.
    explanation: A pod mounts claims of its own namespace.
  correct_option: b
  explanation: The kubelet mounts the volume for the new pod.
- id: ats042-110-q02
  type: single_choice
  difficulty: beginner
  learning_objective: Describe how a claim, a volume and a storage class relate and
    how binding works.
  source_readings:
  - sections/section-110/module-01/course-01-volumes-claims-and-who-reaches-the-data.md
  prompt: A PersistentVolumeClaim stays in the state Pending after creation, and the
    storage class uses WaitForFirstConsumer. What is the most likely reason?
  options:
  - id: a
    text: The storage class is broken.
    explanation: A pending claim in this mode is normal.
  - id: b
    text: No pod uses the claim yet, so no volume has been created.
    explanation: Correct. The volume is created where the first pod is scheduled.
  - id: c
    text: The claim must be approved by an administrator.
    explanation: There is no approval step.
  - id: d
    text: The claim is in the wrong namespace.
    explanation: The claim is in its namespace.
  correct_option: b
  explanation: The volume is created where the first pod is scheduled.
- id: ats042-110-q03
  type: single_choice
  difficulty: beginner
  learning_objective: Describe how a claim, a volume and a storage class relate and
    how binding works.
  source_readings:
  - sections/section-110/module-01/course-01-volumes-claims-and-who-reaches-the-data.md
  prompt: Which object is cluster scoped?
  options:
  - id: a
    text: PersistentVolumeClaim.
    explanation: It belongs to a namespace.
  - id: b
    text: PersistentVolume.
    explanation: Correct. A volume has no namespace.
  - id: c
    text: The pod that mounts the claim.
    explanation: A pod belongs to a namespace.
  - id: d
    text: The volumeMount of a container.
    explanation: It is a field of a pod.
  correct_option: b
  explanation: A volume has no namespace.
- id: ats042-110-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Use read-only mounts and explain what they do not protect.
  source_readings:
  - sections/section-110/module-01/course-02-mount-options-access-modes-and-reclaim.md
  prompt: A container mounts a volume with readOnly set to true and runs as root.
    What happens when it tries to write a file?
  options:
  - id: a
    text: The write succeeds because root ignores mount flags.
    explanation: The mount itself is read-only.
  - id: b
    text: The write fails with a read-only file system error, and reads still work.
    explanation: Correct. The flag stops writes and not reads.
  - id: c
    text: The container is killed.
    explanation: It receives an error and keeps running.
  - id: d
    text: The write is stored in a temporary layer.
    explanation: The volume is not a layer of the container.
  correct_option: b
  explanation: The flag stops writes and not reads.
- id: ats042-110-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Compare access modes and state what they promise.
  source_readings:
  - sections/section-110/module-01/course-02-mount-options-access-modes-and-reclaim.md
  prompt: A claim uses the access mode ReadWriteOnce. What does this guarantee?
  options:
  - id: a
    text: Only one pod in the cluster can mount the volume.
    explanation: That is ReadWriteOncePod.
  - id: b
    text: The volume can be mounted read-write by one node, and several pods on that
      node can use it.
    explanation: Correct. The mode is defined per node.
  - id: c
    text: Only the creating user can read the data.
    explanation: Access modes do not check users.
  - id: d
    text: The volume is encrypted.
    explanation: It has no relation to encryption.
  correct_option: b
  explanation: The mode is defined per node.
- id: ats042-110-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain the reclaim policies and the risk of each.
  source_readings:
  - sections/section-110/module-01/course-02-mount-options-access-modes-and-reclaim.md
  prompt: A claim with a volume that uses Retain is deleted. What state does the volume
    reach?
  options:
  - id: a
    text: It is deleted with its data.
    explanation: That is the Delete policy.
  - id: b
    text: Released, with the data still in the backend.
    explanation: Correct. Retain keeps the volume and the data.
  - id: c
    text: Available for any new claim at once.
    explanation: The old claim reference blocks reuse.
  - id: d
    text: Bound to the next claim in the namespace.
    explanation: It stays Released until an administrator acts.
  correct_option: b
  explanation: Retain keeps the volume and the data.
- id: ats042-110-q07
  type: single_choice
  difficulty: advanced
  learning_objective: Explain the reclaim policies and the risk of each.
  source_readings:
  - sections/section-110/module-01/course-02-mount-options-access-modes-and-reclaim.md
  prompt: An administrator frees a Released volume for a new team by clearing its
    claimRef, without cleaning it. What is the risk?
  options:
  - id: a
    text: The volume will not bind.
    explanation: It will bind.
  - id: b
    text: The new team receives the files of the earlier owner.
    explanation: Correct. The data stays on the volume.
  - id: c
    text: The volume is deleted.
    explanation: Retain does not delete it.
  - id: d
    text: The storage class changes.
    explanation: It does not.
  correct_option: b
  explanation: The data stays on the volume.
- id: ats042-110-q08
  type: single_choice
  difficulty: advanced
  learning_objective: Explain why host path volumes are dangerous and how Pod Security
    Admission refuses them.
  source_readings:
  - sections/section-110/module-01/course-03-host-paths-backups-and-data-lifecycle.md
  prompt: A pod mounts a hostPath of /var/lib/kubelet. What can it reach?
  options:
  - id: a
    text: Only its own volumes.
    explanation: The path holds data of all pods on the node.
  - id: b
    text: The volumes and service account tokens of other pods on that node.
    explanation: Correct. The kubelet keeps these in that directory.
  - id: c
    text: Only files in its own namespace.
    explanation: The node file system has no namespaces.
  - id: d
    text: Nothing, because the API server filters paths.
    explanation: It does not filter host paths without admission rules.
  correct_option: b
  explanation: The kubelet keeps these in that directory.
- id: ats042-110-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain why host path volumes are dangerous and how Pod Security
    Admission refuses them.
  source_readings:
  - sections/section-110/module-01/course-03-host-paths-backups-and-data-lifecycle.md
  prompt: A namespace has the label pod-security.kubernetes.io/enforce set to baseline.
    What happens to a new pod with a hostPath volume?
  options:
  - id: a
    text: It is admitted with a warning.
    explanation: That is the warn mode.
  - id: b
    text: The API server rejects it.
    explanation: Correct. The baseline profile forbids hostPath in enforce mode.
  - id: c
    text: It is scheduled on a control plane node.
    explanation: Placement is not affected.
  - id: d
    text: It is admitted and only logged.
    explanation: That is the audit mode.
  correct_option: b
  explanation: The baseline profile forbids hostPath in enforce mode.
- id: ats042-110-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain what snapshots, backups and encryption at rest protect
    and what deletion leaves behind.
  source_readings:
  - sections/section-110/module-01/course-03-host-paths-backups-and-data-lifecycle.md
  prompt: A team deletes a claim and its volume to satisfy a request to erase customer
    data. Which statement is correct?
  options:
  - id: a
    text: The data is erased from every location.
    explanation: Snapshots and backups remain.
  - id: b
    text: The objects are gone, but snapshots, replicas, backups and backend blocks
      may still hold the data.
    explanation: Correct. Each copy must be handled on its own.
  - id: c
    text: Encryption at rest erases the data on deletion.
    explanation: It only protects the medium.
  - id: d
    text: Deleting the pod is enough.
    explanation: The pod does not hold persistent data.
  correct_option: b
  explanation: Each copy must be handled on its own.
