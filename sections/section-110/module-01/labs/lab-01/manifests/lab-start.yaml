apiVersion: v1
kind: Namespace
metadata:
  name: ledger
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: collector
  namespace: ledger
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reporter
  namespace: ledger
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inspector
  namespace: ledger
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clerk
  namespace: ledger
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: records
  namespace: ledger
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: ledger
  labels:
    app: collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      serviceAccountName: collector
      containers:
        - name: collector
          image: busybox:1.37.0
          command: ["sh", "-c", "while true; do date >> /data/log.txt; sleep 10; done"]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: records
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporter
  namespace: ledger
  labels:
    app: reporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reporter
  template:
    metadata:
      labels:
        app: reporter
    spec:
      serviceAccountName: reporter
      containers:
        - name: reporter
          image: busybox:1.37.0
          command: ["sh", "-c", "while true; do cat /data/log.txt > /dev/null 2>&1; sleep 10; done"]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: records
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inspector
  namespace: ledger
  labels:
    app: inspector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inspector
  template:
    metadata:
      labels:
        app: inspector
    spec:
      serviceAccountName: inspector
      containers:
        - name: inspector
          image: busybox:1.37.0
          command: ["sleep", "3600"]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: records
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: clerk
  namespace: ledger
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clerk
  namespace: ledger
subjects:
  - kind: ServiceAccount
    name: clerk
    namespace: ledger
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clerk
