apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: clerk
  namespace: ledger
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clerk
  namespace: ledger
subjects:
  - kind: ServiceAccount
    name: clerk
    namespace: ledger
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clerk
