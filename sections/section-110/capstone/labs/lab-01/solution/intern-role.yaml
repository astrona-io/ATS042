apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: intern
  namespace: depot
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: intern
  namespace: depot
subjects:
  - kind: ServiceAccount
    name: intern
    namespace: depot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: intern
