apiVersion: v1
kind: ServiceAccount
metadata:
  name: crew
  namespace: starfleet
---
apiVersion: v1
kind: Secret
metadata:
  name: warp-key
  namespace: starfleet
type: Opaque
stringData:
  key: not-a-real-key
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crew-ops
  namespace: starfleet
rules:
  - apiGroups: [""]
    resources: ["pods", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/ephemeralcontainers"]
    verbs: ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crew-ops
  namespace: starfleet
subjects:
  - kind: ServiceAccount
    name: crew
    namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crew-ops
