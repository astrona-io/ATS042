apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: relay-role
  namespace: hangar
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: relay-role
  namespace: hangar
subjects:
  - kind: ServiceAccount
    name: relay
    namespace: hangar
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: relay-role
