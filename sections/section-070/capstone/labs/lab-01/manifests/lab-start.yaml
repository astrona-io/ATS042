apiVersion: v1
kind: Namespace
metadata:
  name: galley
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pantry
  namespace: galley
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oven
  namespace: galley
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chef
  namespace: galley
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pantry
  namespace: galley
  labels:
    app: pantry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pantry
  template:
    metadata:
      labels:
        app: pantry
    spec:
      serviceAccountName: pantry
      hostNetwork: true
      containers:
        - name: pantry
          image: busybox:1.37.0
          command: ["sleep", "3600"]
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oven
  namespace: galley
  labels:
    app: oven
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oven
  template:
    metadata:
      labels:
        app: oven
    spec:
      serviceAccountName: oven
      hostPID: true
      containers:
        - name: oven
          image: busybox:1.37.0
          command: ["sleep", "3600"]
          volumeMounts:
            - name: host-etc
              mountPath: /host-etc
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
      volumes:
        - name: host-etc
          hostPath:
            path: /etc
            type: Directory
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chef-role
  namespace: galley
rules:
  - apiGroups: [""]
    resources: ["pods", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/ephemeralcontainers"]
    verbs: ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chef-role
  namespace: galley
subjects:
  - kind: ServiceAccount
    name: chef
    namespace: galley
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chef-role
