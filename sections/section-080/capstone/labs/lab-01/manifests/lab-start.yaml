apiVersion: v1
kind: Namespace
metadata:
  name: vault
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: exporter
  namespace: vault
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: restore
  namespace: vault
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-ops
  namespace: vault
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-target
  namespace: vault
data:
  bucket: starfleet-archive
  access-key: AKIA-NOT-A-REAL-KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: archive-key
  namespace: vault
type: Opaque
stringData:
  key: not-a-real-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exporter
  namespace: vault
  labels:
    app: exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exporter
  template:
    metadata:
      labels:
        app: exporter
    spec:
      serviceAccountName: exporter
      containers:
        - name: exporter
          image: busybox:1.37.0
          command: ["sleep", "3600"]
          env:
            - name: ACCESS_KEY
              valueFrom:
                configMapKeyRef:
                  name: backup-target
                  key: access-key
          volumeMounts:
            - name: host-0
              mountPath: /host-0
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
      volumes:
        - name: host-0
          hostPath:
            path: /var/lib/etcd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restore
  namespace: vault
  labels:
    app: restore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restore
  template:
    metadata:
      labels:
        app: restore
    spec:
      serviceAccountName: restore
      containers:
        - name: restore
          image: busybox:1.37.0
          command: ["sleep", "3600"]
          volumeMounts:
            - name: host-0
              mountPath: /host-0
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
      volumes:
        - name: host-0
          hostPath:
            path: /etc/kubernetes/pki
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backup-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backup-ops-secrets
subjects:
  - kind: ServiceAccount
    name: backup-ops
    namespace: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backup-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: everyone-secrets
  namespace: vault
subjects:
  - kind: Group
    name: system:authenticated
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backup-secrets
