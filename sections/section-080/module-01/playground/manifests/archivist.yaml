apiVersion: v1
kind: ServiceAccount
metadata:
  name: archivist
  namespace: starfleet
---
apiVersion: v1
kind: Secret
metadata:
  name: warp-key
  namespace: starfleet
type: Opaque
stringData:
  key: not-a-real-key
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secret-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: archivist-secrets
subjects:
  - kind: ServiceAccount
    name: archivist
    namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secret-reader
