apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-key-reader
  namespace: archive
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["backup-key"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: snapshotter-backup-key
  namespace: archive
subjects:
  - kind: ServiceAccount
    name: snapshotter
    namespace: archive
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backup-key-reader
