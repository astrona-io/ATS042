apiVersion: v1
kind: Namespace
metadata:
  name: deck
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loader
  namespace: deck
---
apiVersion: v1
kind: Secret
metadata:
  name: loader-token
  namespace: deck
  annotations:
    kubernetes.io/service-account.name: loader
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: loader-admin
subjects:
  - kind: ServiceAccount
    name: loader
    namespace: deck
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hold
  namespace: deck
  labels:
    app: hold
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hold
  template:
    metadata:
      labels:
        app: hold
    spec:
      serviceAccountName: hold
      containers:
        - name: hold
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hold
  namespace: deck
spec:
  selector:
    app: hold
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ci-kubeconfig
  namespace: deck
data:
  config: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: deck
        cluster:
          server: https://203.0.113.10:6443
          insecure-skip-tls-verify: true
    users:
      - name: runner
        user:
          exec:
            apiVersion: client.authentication.k8s.io/v1
            command: /bin/sh
            args: ["-c", "cat /tmp/fetch-token"]
            interactiveMode: Never
    contexts:
      - name: deck
        context:
          cluster: deck
          user: runner
    current-context: deck
---
apiVersion: certificates.k8s.io/v1
kind: CertificateSigningRequest
metadata:
  name: pilot
spec:
  request: 
  signerName: kubernetes.io/kube-apiserver-client
  expirationSeconds: 3600
  usages:
    - client auth
---
apiVersion: certificates.k8s.io/v1
kind: CertificateSigningRequest
metadata:
  name: pilot-root
spec:
  request: 
  signerName: kubernetes.io/kube-apiserver-client
  expirationSeconds: 3600
  usages:
    - client auth
