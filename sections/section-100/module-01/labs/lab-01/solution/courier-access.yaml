apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: courier-pods
  namespace: dock
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: courier-pods
  namespace: dock
subjects:
  - kind: ServiceAccount
    name: courier
    namespace: dock
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: courier-pods
