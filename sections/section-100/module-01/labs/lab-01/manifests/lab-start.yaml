apiVersion: v1
kind: Namespace
metadata:
  name: dock
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: courier
  namespace: dock
---
apiVersion: v1
kind: Secret
metadata:
  name: courier-token
  namespace: dock
  annotations:
    kubernetes.io/service-account.name: courier
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: courier-admin
subjects:
  - kind: ServiceAccount
    name: courier
    namespace: dock
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: deploy-kubeconfig
  namespace: dock
data:
  config: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: dock
        cluster:
          server: https://203.0.113.10:6443
          insecure-skip-tls-verify: true
    users:
      - name: runner
        user:
          token: example-token-value
    contexts:
      - name: dock
        context:
          cluster: dock
          user: runner
    current-context: dock
---
apiVersion: certificates.k8s.io/v1
kind: CertificateSigningRequest
metadata:
  name: ensign
spec:
  request: 
  signerName: kubernetes.io/kube-apiserver-client
  expirationSeconds: 3600
  usages:
    - client auth
---
apiVersion: certificates.k8s.io/v1
kind: CertificateSigningRequest
metadata:
  name: intruder
spec:
  request: 
  signerName: kubernetes.io/kube-apiserver-client
  expirationSeconds: 3600
  usages:
    - client auth
