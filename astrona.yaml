# Course manifest. Labs and playgrounds are UNTESTED (static checks only). Older YAML banks are registered in assessments/index.yaml.
training:
  id: ATS042
  title: 'KCSA: Kubernetes Cluster Component Security'
  description: Concept lessons, diagrams, playgrounds, graded labs, capstones and
    original scenario assessments covering every published objective in this KCSA
    domain. Labs and playgrounds are UNTESTED.
  certification:
    name: Kubernetes and Cloud Native Security Associate
    code: KCSA
    provider: CNCF / Linux Foundation
    domain: Kubernetes Cluster Component Security
    weight: 22
    competencies:
    - API Server
    - Controller Manager
    - Scheduler
    - Kubelet
    - Container Runtime
    - KubeProxy
    - Pod
    - Etcd
    - Container Networking
    - Client Security
    - Storage
modules:
- id: module-intro
  title: Introduction
  description: Audience, learning approach, reading requirements and contribution
    process.
  content:
  - type: reading
    title: Introduction
    path: sections/intro/README.md
  - type: reading
    title: Welcome To The Course
    path: sections/intro/course-01-welcome.md
  - type: reading
    title: Get Your Machine Ready
    path: sections/intro/course-02-get-your-machine-ready.md
  - type: reading
    title: How This Course Is Made
    path: sections/intro/course-03-how-this-course-is-made.md
- id: module-010
  title: API Server
  description: 'Follow one request through the kube-apiserver: authentication, authorization
    and admission. Reduce exposure by removing anonymous and over-broad grants, write
    least-privilege RBAC, and add admission policy that rejects unsafe objects.'
  status: alpha
  content:
  - type: reading
    title: 'API Server: Introduction'
    path: sections/section-010/README.md
  - type: reading
    title: API Server Security Boundaries
    path: sections/section-010/module-01/course.md
  - type: reading
    title: Protecting The Cluster API
    path: sections/section-010/module-01/course-01-protecting-the-cluster-api.md
  - type: reading
    title: Authorization And Least Privilege With RBAC
    path: sections/section-010/module-01/course-02-authorization-and-least-privilege.md
  - type: reading
    title: Admission Control And Audit Evidence
    path: sections/section-010/module-01/course-03-admission-control-and-audit-evidence.md
  - type: reading
    title: Question
    path: sections/section-010/module-01/labs/lab-01/question.md
  - type: lab
    title: Close Anonymous Access And Add Admission Policy
    path: sections/section-010/module-01/labs/lab-01
    difficulty: intermediate
    estimated_duration: 25m
    topic: api-server
    task_kind: build
    tags:
    - rbac
    - anonymous-access
    - serviceaccount
    - validatingadmissionpolicy
    - cel
    - automount
    learning_goals:
    - Remove a binding that gives cluster read access to unauthenticated users
    - Replace cluster-admin on a pipeline service account with a namespaced Role
    - Reject privileged pods with a ValidatingAdmissionPolicy and stop a service account
      token from mounting
    resources:
    - name: Kubernetes RBAC reference
      url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
    - name: ValidatingAdmissionPolicy
      url: https://kubernetes.io/docs/reference/access-authn-authz/validating-admission-policy/
  - type: reading
    title: Summary
    path: sections/section-010/module-01/course-04-summary.md
  - type: reading
    title: Question
    path: sections/section-010/capstone/labs/lab-01/question.md
  - type: lab
    title: Secure A New Team Namespace At The API
    path: sections/section-010/capstone/labs/lab-01
    difficulty: advanced
    estimated_duration: 30m
    topic: api-server
    task_kind: build
    tags:
    - rbac
    - admission
    - validatingadmissionpolicy
    - pod-security-admission
    - least-privilege
    learning_goals:
    - Remove a binding that gives every authenticated user edit rights
    - Scope a secret-reading group to one namespace and reduce a wildcard Role
    - Require a team label on Deployments with an admission policy and enforce a Pod
      Security level
    resources:
    - name: Kubernetes RBAC reference
      url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
    - name: Pod Security Admission
      url: https://kubernetes.io/docs/concepts/security/pod-security-admission/
  - type: quiz
    title: 'Knowledge Check: API Server'
    path: sections/section-010/quiz.yaml
    pass_score: 70
- id: module-020
  title: Controller Manager
  description: Explain how the kube-controller-manager and custom controllers reconcile
    cluster state, which identities they run as and what a compromised controller
    can do. Practise least-privilege RBAC for controllers, ownership and garbage collection,
    and recovery when reconciliation stops.
  status: alpha
  content:
  - type: reading
    title: 'Controller Manager: Introduction'
    path: sections/section-020/README.md
  - type: reading
    title: Controller Manager Authority
    path: sections/section-020/module-01/course.md
