  - type: quiz
    title: 'Knowledge Check: Controller Manager'
    path: sections/section-020/quiz.yaml
    pass_score: 70
- id: module-030
  title: Scheduler
  description: Follow a pod through the kube-scheduler, from filtering and scoring
    to binding. Protect placement rules with node labels, taints and admission policy,
    control who may bind pods or change nodes, and keep scheduling available with
    requests, priorities and quotas.
  status: alpha
