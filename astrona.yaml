    title: Securing Reconciliation Components
    path: sections/section-020/module-01/course-01-securing-reconciliation-components.md
  - type: reading
    title: Controller Identities And RBAC
    path: sections/section-020/module-01/course-02-controller-identities-and-rbac.md
  - type: reading
    title: Ownership, Recovery And Failure
    path: sections/section-020/module-01/course-03-ownership-recovery-and-failure.md
  - type: reading
    title: Question
    path: sections/section-020/module-01/labs/lab-01/question.md
  - type: lab
    title: Limit A Custom Controller With RBAC And Ownership
    path: sections/section-020/module-01/labs/lab-01
    difficulty: intermediate
    estimated_duration: 25m
    topic: controller-manager
    task_kind: build
    tags:
    - rbac
    - controller
    - resourcenames
    - escalate
    - ownerreferences
    - garbage-collection
    learning_goals:
    - Replace a wildcard ClusterRole and ClusterRoleBinding with a namespaced Role
      limited by resource name
    - Remove escalate and bind from a service account
    - Attach an ownerReference so the garbage collector removes a dependent object
    resources:
    - name: Kubernetes RBAC reference
      url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
    - name: Garbage collection
      url: https://kubernetes.io/docs/concepts/architecture/garbage-collection/
  - type: reading
    title: Summary
    path: sections/section-020/module-01/course-04-summary.md
  - type: reading
    title: Question
    path: sections/section-020/capstone/labs/lab-01/question.md
  - type: lab
    title: Secure An Operator And Restore Reconciliation
    path: sections/section-020/capstone/labs/lab-01
    difficulty: advanced
    estimated_duration: 30m
    topic: controller-manager
    task_kind: build
    tags:
    - rbac
    - operator
    - paused-deployment
    - cronjob
    - ttl
    - least-privilege
    learning_goals:
    - Scope an operator service account to one namespace and remove escalation rights
    - Resume a paused Deployment so its controller reconciles it
    - Limit finished Job history so cleanup controllers remove old Jobs
    resources:
    - name: Kubernetes RBAC reference
      url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
    - name: Deployments
      url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
    - name: CronJob
